name: Server CI

on:
  push:
    branches:
      - "claude/**"
      - "Account-Test"
      - "main"
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch: {}

jobs:
  # Migrations are applied to the real Neon database only by Render, as the API
  # service's Pre-Deploy Command (`npm run migrate`), right before a new build of
  # `main` goes live -- never from CI. A push to any branch (claude/**, a test
  # branch) therefore never touches production data, and the production
  # connection string is not a GitHub secret at all. See docs/DEPLOYMENT.md §1.
  #
  # The test job below still applies every migration from scratch, to a
  # throwaway Postgres, before the suite runs (npm test's pretest step), so a
  # migration that fails to apply still turns CI red before it can be deployed.
  #
  # The automated API test suite (tests/*.test.ts) TRUNCATEs its tables
  # between every test, so it runs against a throwaway Postgres service
  # container that lives only for this job, never against the real Neon
  # project. That also means this job needs no secret at all — full test
  # coverage runs the same way for every push or PR, with no dependency on
  # repository-secret access.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mangotv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mangotv_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated API tests
        run: npm test
