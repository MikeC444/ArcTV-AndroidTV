name: Launch check (Android emulators)

# Starts an Android emulator on several Android versions, installs the chosen released APKs one after another, opens the app and says whether it
# crashed, keeping the full log. Run by hand: Actions > "Launch check (Android emulators)" > Run workflow. It never publishes anything.
# The emulators are x86_64, so this exercises the app's Kotlin/Compose code on each Android version, but not a 32-bit ARM TV box's own libraries.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to test, space separated (the first is the one under suspicion)"
        default: "v0.5.0 v0.4.1"
        required: true
      wait_seconds:
        description: "How long to leave the app open before checking it is still running"
        default: "25"
        required: true

permissions:
  contents: read

jobs:
  launch:
    name: Android ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 23, label: "6 (API 23)", target: default }
          - { api: 26, label: "8 (API 26)", target: default }
          - { api: 28, label: "9 (API 28)", target: default }
          - { api: 29, label: "10 (API 29)", target: default }
          - { api: 34, label: "14 (API 34)", target: google_apis }
    steps:
      - uses: actions/checkout@v4

      - name: Download the release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks
          for tag in ${{ inputs.tags }}; do
            gh release download "$tag" --repo "${{ github.repository }}" --pattern 'app-release.apk' --output "apks/$tag.apk"
          done
          ls -l apks

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the emulator and run the check
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEVICE_LABEL: Android ${{ matrix.label }}
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/launch-check.sh logs/api${{ matrix.api }} apks/*.apk

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android-${{ matrix.api }}
          path: logs
          if-no-files-found: warn
