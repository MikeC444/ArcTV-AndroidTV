<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to ArcTV</title>
    <link rel="icon" href="/arctv-logo.png" />
    <style>
      :root {
        color-scheme: dark;
        --cyan: #19e6ff;
        --blue: #2f80ff;
        --violet: #9b5cff;
        --text: #f6f6f8;
        --text-2: #afafb8;
        --text-3: #92929c;
        --surface: #1c1c20;
        --line: rgba(255, 255, 255, 0.12);
        --brand: linear-gradient(103deg, var(--cyan), var(--blue), var(--violet));
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 28px 20px 24px;
        background: radial-gradient(900px 500px at 15% -10%, rgba(47, 128, 255, 0.28), transparent 60%),
          radial-gradient(800px 500px at 100% 110%, rgba(155, 92, 255, 0.26), transparent 60%), #05080f;
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
      }
      .logo {
        display: block;
        width: 180px;
        max-width: 60%;
        height: auto;
        margin: 4px auto 28px;
      }
      .eyebrow {
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.15;
        font-weight: 800;
      }
      #subtitle {
        margin: 0 0 22px;
        color: var(--text-2);
        font-size: 17px;
      }
      .device {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        margin-bottom: 22px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
      }
      .device svg {
        width: 34px;
        height: 34px;
        flex: none;
        stroke: var(--text);
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .device strong {
        display: block;
        font-size: 17px;
      }
      .device span {
        color: var(--text-2);
        font-size: 14px;
      }
      .dot {
        width: 12px;
        height: 12px;
        margin-left: auto;
        border-radius: 50%;
        background: var(--text-3);
      }
      .dot.ok {
        background: #2ecc71;
      }
      #tabs {
        display: flex;
        gap: 4px;
        padding: 4px;
        margin-bottom: 18px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
      }
      .tab {
        flex: 1;
        padding: 11px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        border-radius: 9px;
        border: none;
        background: transparent;
        color: var(--text-2);
        cursor: pointer;
      }
      .tab.active {
        background: var(--brand);
        color: #05080f;
      }
      label {
        display: block;
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-2);
      }
      .field {
        position: relative;
        margin-bottom: 16px;
      }
      .field svg {
        position: absolute;
        left: 14px;
        top: 50%;
        width: 20px;
        height: 20px;
        margin-top: -10px;
        stroke: var(--text-3);
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }
      input {
        width: 100%;
        padding: 15px 14px 15px 44px;
        font: inherit;
        font-size: 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
      }
      input::placeholder {
        color: var(--text-3);
      }
      input:focus {
        outline: 2px solid var(--cyan);
        outline-offset: 1px;
      }
      #password {
        padding-right: 48px;
      }
      #toggle {
        position: absolute;
        right: 4px;
        top: 50%;
        width: 44px;
        height: 44px;
        margin-top: -22px;
        border: none;
        background: transparent;
        color: var(--text-3);
        cursor: pointer;
        border-radius: 10px;
      }
      #toggle svg {
        position: static;
        margin: 0;
        stroke: currentColor;
      }
      #toggle:focus-visible {
        outline: 2px solid var(--cyan);
      }
      button[type="submit"] {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 16px;
        font: inherit;
        font-size: 17px;
        font-weight: 800;
        border-radius: 12px;
        border: none;
        background: var(--brand);
        color: #05080f;
        cursor: pointer;
      }
      button[type="submit"] svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      button[type="submit"]:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      button[type="submit"]:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .note {
        margin: 12px 0 0;
        text-align: center;
        font-size: 14px;
        color: var(--text-3);
      }
      #message {
        min-height: 20px;
        margin: 14px 0 0;
        text-align: center;
        line-height: 1.5;
        color: var(--text-2);
      }
      #message.error {
        color: #ff6b8a;
      }
      #message.success {
        color: #2ecc71;
      }
      .switch {
        margin: 22px 0 0;
        text-align: center;
        color: var(--text-2);
      }
      .switch button {
        padding: 0;
        font: inherit;
        font-weight: 700;
        color: var(--text);
        background: none;
        border: none;
        border-bottom: 1px solid var(--text);
        cursor: pointer;
      }
      footer {
        margin-top: 28px;
        text-align: center;
        font-size: 13px;
        color: var(--text-3);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/arctv-logo.png" alt="ArcTV" width="1116" height="338" />

      <p class="eyebrow">TV sign-in</p>
      <h1 id="heading">Sign in to your TV</h1>
      <p id="subtitle">You're one step away. Sign in below to connect your TV automatically.</p>

      <div class="device" aria-live="polite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8 20.5h8M12 16.5v4"/></svg>
        <div><strong>Fire TV</strong><span id="device-state">Waiting to connect</span></div>
        <i class="dot" id="device-dot" aria-hidden="true"></i>
      </div>

      <div id="tabs" role="tablist">
        <button type="button" id="tab-login" class="tab active" role="tab">Sign In</button>
        <button type="button" id="tab-register" class="tab" role="tab">Create Account</button>
      </div>

      <form id="form">
        <div id="name-wrap" class="field" hidden>
          <label for="displayName">Display name <span style="font-weight:400">(optional)</span></label>
          <div class="field" style="margin:0">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-5.5 8-5.5s6.5 1.5 8 5.500"/></svg>
            <input type="text" id="displayName" placeholder="Your name" autocomplete="nickname" />
          </div>
        </div>

        <label for="email">Email address</label>
        <div class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.500 6 8.500-6"/></svg>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <label for="password">Password</label>
        <div class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" minlength="8" />
          <button type="button" id="toggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <button type="submit" id="submit"><span id="submit-label">Sign in &amp; connect TV</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button>
      </form>

      <p id="message" role="status"></p>
      <p class="note" id="note">Your TV will update once you're signed in.</p>

      <p class="switch" id="switch">
        <span id="switch-text">New to ArcTV?</span>
        <button type="button" id="switch-btn">Create an account</button>
      </p>

      <footer>Secure sign-in</footer>
    </main>
    <script src="/activate.js"></script>
  </body>
</html>
